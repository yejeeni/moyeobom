<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모여봄 테스트</title>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; background: #f6f6f4; color: #222; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  h2 { font-size: 14px; margin: 16px 0 6px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
  button { padding: 4px 10px; cursor: pointer; }
  input { padding: 4px 6px; }
  .layout { display: grid; grid-template-columns: 360px 1fr; gap: 16px; }
  @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-width: 520px; }
  .seat { background: #fff; border: 1px solid #ccc; border-radius: 6px; padding: 8px; min-height: 70px; font-size: 13px; }
  .seat.me { border: 2px solid #2f6fed; }
  .seat.empty { color: #aaa; background: #eee; }
  .FOCUS { color: #1a7f37; font-weight: bold; }
  .BREAK { color: #b26b00; font-weight: bold; }
  .IDLE { color: #777; font-weight: bold; }
  .task { display: flex; gap: 6px; align-items: center; padding: 4px 0; border-bottom: 1px solid #ddd; font-size: 13px; }
  .task .title { flex: 1; }
  .done { text-decoration: line-through; color: #888; }
  #log { background: #1e1e1e; color: #ddd; font: 12px monospace; height: 220px; overflow: auto; padding: 8px; white-space: pre-wrap; }
  .muted { color: #777; font-size: 12px; }
</style>
</head>
<body>
<h1>모여봄 테스트 페이지 <span class="muted">(로컬 개발용)</span></h1>

<div class="layout">
  <div>
    <h2>게스트</h2>
    <div class="row"><span id="guest" class="muted"></span></div>
    <div class="row"><button onclick="newGuest()">새 게스트 발급</button></div>

    <h2>할 일</h2>
    <div class="row">
      <input id="title" placeholder="제목" size="14">
      <input id="minutes" placeholder="예상 분" size="5" type="number" min="1">
      <button onclick="addTask()">추가 / 스프린트 시작</button>
    </div>
    <div id="carry"></div>
    <div id="tasks"></div>

    <h2>내 상태</h2>
    <div class="row"><span id="me">-</span></div>
    <div class="row">
      <button onclick="enterRoom()">열람실 입장·연결</button>
      <button onclick="stop('BREAK')">휴식</button>
      <button onclick="stop('STOPPED')">중단</button>
    </div>
    <div class="row">
      <button onclick="review()">회고 보기</button>
      <button onclick="closeSprint()">오늘 마무리 (전부 이월)</button>
    </div>
    <div class="row">
      <label><input type="checkbox" id="alert" onchange="saveSetting()"> 휴식 알림</label>
      <input id="alertMinutes" type="number" min="1" value="50" size="4" onchange="saveSetting()"> 분
    </div>
  </div>

  <div>
    <h2>열람실 <span id="summary" class="muted"></span></h2>
    <div id="grid" class="grid"></div>
    <h2>이벤트 로그</h2>
    <div id="log"></div>
  </div>
</div>

<script>
const API = '/api/v1';
let guestId = localStorage.getItem('moyeobom.guestId');
let stomp = null, roomId = null, mySeatNo = null, offset = 0;
let seats = {};
let myStatus = null;

function log(...args) {
  const el = document.getElementById('log');
  el.textContent = new Date().toLocaleTimeString() + ' ' + args.map(a => typeof a === 'string' ? a : JSON.stringify(a)).join(' ') + '\n' + el.textContent;
}

async function api(method, path, body) {
  const res = await fetch(API + path, {
    method,
    headers: { 'Content-Type': 'application/json', ...(guestId ? { 'X-Guest-Id': guestId } : {}) },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const text = await res.text();
  const data = text ? JSON.parse(text) : null;
  if (!res.ok) { log('❌', method, path, res.status, data); throw data; }
  return data;
}

function fmt(seconds) {
  seconds = Math.max(0, Math.floor(seconds));
  const h = Math.floor(seconds / 3600), m = Math.floor(seconds % 3600 / 60), s = seconds % 60;
  return (h ? h + '시간 ' : '') + m + '분 ' + (h ? '' : s + '초');
}
function since(iso) { return (Date.now() + offset - Date.parse(iso)) / 1000; }
const STATE = { FOCUS: '집중', BREAK: '휴식', IDLE: '대기' };

async function newGuest() {
  guestId = null;
  const data = await api('POST', '/guests');
  guestId = data.guestId;
  localStorage.setItem('moyeobom.guestId', guestId);
  if (stomp) stomp.deactivate();
  roomId = null; seats = {};
  await refresh();
}

async function refresh() {
  document.getElementById('guest').textContent = guestId || '없음';
  if (!guestId) return;
  try { await api('GET', '/guests/me'); } catch (e) { guestId = null; localStorage.removeItem('moyeobom.guestId'); return refresh(); }
  const { sprint } = await api('GET', '/sprints/current');
  myStatus = await api('GET', '/focus/current');
  const setting = await api('GET', '/guests/me/setting');
  document.getElementById('alert').checked = setting.breakAlertEnabled;
  document.getElementById('alertMinutes').value = setting.breakAlertMinutes;
  renderTasks(sprint);
  if (!sprint) {
    const { tasks } = await api('GET', '/sprints/carryover');
    renderCarry(tasks);
  } else {
    document.getElementById('carry').innerHTML = '';
  }
}

function renderCarry(tasks) {
  const box = document.getElementById('carry');
  box.innerHTML = '';
  if (!tasks.length) return;
  const head = document.createElement('div');
  head.className = 'muted';
  head.textContent = '이월 할 일 (스프린트 시작 때 함께 들어감)';
  box.appendChild(head);
  tasks.forEach(t => {
    const row = document.createElement('div');
    row.className = 'task';
    row.innerHTML = '<label><input type="checkbox" checked> <span></span></label>';
    row.querySelector('input').dataset.id = t.taskId;
    row.querySelector('span').textContent = `${t.title} (누적 ${fmt(t.cumulativeSeconds)})`;
    box.appendChild(row);
  });
}

function renderTasks(sprint) {
  const box = document.getElementById('tasks');
  box.innerHTML = '';
  if (!sprint) { box.innerHTML = '<div class="muted">열린 스프린트 없음. 할 일을 추가하면 시작돼요.</div>'; return; }
  sprint.tasks.forEach(t => {
    const row = document.createElement('div');
    row.className = 'task';
    const title = document.createElement('span');
    title.className = 'title' + (t.status === 'DONE' ? ' done' : '');
    const focusing = myStatus?.session?.taskId === t.taskId;
    title.textContent = `${focusing ? '▶ ' : ''}${t.title} · ${fmt(t.actualSeconds)}`
      + (t.estimatedMinutes ? ` / 예상 ${t.estimatedMinutes}분` : '')
      + (t.cumulativeSeconds !== t.actualSeconds ? ` (누적 ${fmt(t.cumulativeSeconds)})` : '');
    row.appendChild(title);
    if (t.status === 'TODO') {
      row.appendChild(button('집중', () => act('POST', `/tasks/${t.taskId}/focus`)));
      row.appendChild(button('완료', async () => {
        const res = await api('POST', `/tasks/${t.taskId}/complete`);
        log('✅ 완료 ·', res.refreshMessage);
        await refresh();
      }));
      if (!t.hasRecords) row.appendChild(button('삭제', () => act('DELETE', `/tasks/${t.taskId}`)));
    }
    box.appendChild(row);
  });
}

function button(label, onClick) {
  const b = document.createElement('button');
  b.textContent = label;
  b.onclick = onClick;
  return b;
}

async function act(method, path, body) {
  await api(method, path, body);
  await refresh();
}

async function addTask() {
  const title = document.getElementById('title').value;
  const minutes = document.getElementById('minutes').value;
  const task = { title, estimatedMinutes: minutes ? Number(minutes) : null };
  const { sprint } = await api('GET', '/sprints/current');
  if (sprint) {
    await api('POST', '/sprints/current/tasks', task);
  } else {
    const carriedTasks = [...document.querySelectorAll('#carry input:checked')]
      .map(el => ({ fromTaskId: Number(el.dataset.id), estimatedMinutes: null }));
    await api('POST', '/sprints', { tasks: title.trim() ? [task] : [], carriedTasks });
    log('🚀 스프린트 시작');
  }
  document.getElementById('title').value = '';
  document.getElementById('minutes').value = '';
  await refresh();
}

async function stop(reason) { await act('POST', '/focus/stop', { reason }); }

async function saveSetting() {
  await api('PATCH', '/guests/me/setting', {
    breakAlertEnabled: document.getElementById('alert').checked,
    breakAlertMinutes: Number(document.getElementById('alertMinutes').value),
  });
  log('⚙️ 휴식 알림 설정 저장');
}

async function review() {
  const r = await api('GET', '/sprints/current/review');
  log('📊 회고', `총 집중 ${fmt(r.totalFocusSeconds)}, 완료 ${r.completedCount}개, 예상 ${fmt(r.estimatedSecondsOfDone)} 대비 실제 ${fmt(r.actualSecondsOfDone)}`);
  r.tasks.forEach(t => log('   ·', t.title, t.status, `실제 ${fmt(t.actualSeconds)}`,
    t.diffSeconds === null ? '(예상 없음)' : `차이 ${t.diffSeconds > 0 ? '+' : ''}${Math.round(t.diffSeconds / 60)}분`));
}

async function closeSprint() {
  if (myStatus?.state === 'FOCUS') await api('POST', '/focus/stop', { reason: 'STOPPED' });
  await review();
  const r = await api('POST', '/sprints/current/close', {});
  log('🌙 오늘도 수고했어요 ·', r.refreshMessage, `(이월 ${r.carriedCount}, 닫기 ${r.droppedCount})`);
  roomId = null; seats = {};
  if (stomp) stomp.deactivate();
  await refresh();
}

async function enterRoom() {
  const room = await api('POST', '/rooms/enter');
  roomId = room.roomId; mySeatNo = room.seatNo;
  log('🚪 입장', room);
  connect();
}

function connect() {
  if (stomp) stomp.deactivate();
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  stomp = new StompJs.Client({
    brokerURL: `${proto}://${location.host}/ws`,
    connectHeaders: { 'X-Guest-Id': guestId },
    heartbeatIncoming: 10000,
    heartbeatOutgoing: 10000,
    reconnectDelay: 3000,
  });
  stomp.onConnect = () => {
    log('🔌 연결됨');
    stomp.subscribe(`/topic/rooms/${roomId}`, m => onEvent(JSON.parse(m.body)));
    stomp.subscribe('/user/queue/room-snapshot', m => onEvent(JSON.parse(m.body)));
    stomp.subscribe('/user/queue/notices', m => onEvent(JSON.parse(m.body)));
  };
  stomp.onWebSocketClose = () => log('🔌 연결 끊김, 다시 연결하는 중');
  stomp.onStompError = f => log('❌ STOMP 오류', f.headers.message);
  stomp.activate();
}

async function onEvent(e) {
  const seat = seats[e.seatNo];
  switch (e.type) {
    case 'ROOM_SNAPSHOT':
      offset = Date.parse(e.payload.serverTime) - Date.now();
      mySeatNo = e.payload.mySeatNo;
      seats = {};
      e.payload.seats.forEach(s => seats[s.seatNo] = s.occupant);
      log('📸 스냅샷');
      break;
    case 'SEAT_JOINED':
      seats[e.seatNo] = e.payload;
      log(`👋 ${e.payload.nickname}님이 들어왔어요`);
      break;
    case 'SEAT_LEFT':
      log(`👋 ${seat?.nickname}님이 나갔어요`);
      seats[e.seatNo] = null;
      break;
    case 'STATE_CHANGED':
      if (seat) Object.assign(seat, e.payload);
      log(`${e.seatNo === mySeatNo ? '(나) ' : ''}${seat?.nickname} → ${STATE[e.payload.state]}`);
      if (e.seatNo === mySeatNo) await refresh();
      break;
    case 'COUNTS_CHANGED':
      if (seat) Object.assign(seat, e.payload);
      log(`${seat?.nickname} 완료 ${e.payload.completedCount} / 남은 ${e.payload.remainingCount}`);
      break;
    case 'BREAK_ALERT':
      log('☕ 휴식 알림 ·', e.payload.message);
      alert(e.payload.message);
      break;
    case 'ROOM_NOT_FOUND':
      log('방이 없어서 다시 입장합니다');
      await enterRoom();
      break;
  }
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  let focusing = 0, occupied = 0;
  for (let no = 1; no <= 9; no++) {
    const o = seats[no];
    const div = document.createElement('div');
    div.className = 'seat' + (no === mySeatNo ? ' me' : '') + (o ? '' : ' empty');
    if (o) {
      occupied++;
      if (o.state === 'FOCUS') focusing++;
      const name = document.createElement('div');
      name.textContent = (no === mySeatNo ? '나 · ' : '') + o.nickname;
      const state = document.createElement('div');
      state.innerHTML = `<span class="${o.state}"></span> <span></span>`;
      state.children[0].textContent = STATE[o.state];
      state.children[1].textContent = o.state === 'IDLE' ? '' : fmt(since(o.since));
      const counts = document.createElement('div');
      counts.className = 'muted';
      counts.textContent = `완료 ${o.completedCount} · 남은 ${o.remainingCount}`;
      div.append(name, state, counts);
    } else {
      div.textContent = roomId ? '빈자리' : '';
    }
    grid.appendChild(div);
  }
  document.getElementById('summary').textContent = roomId ? `${occupied}명 중 ${focusing}명 집중 중 · ${roomId}` : '입장 전';
  const me = document.getElementById('me');
  if (myStatus) {
    me.innerHTML = `<span class="${myStatus.state}"></span> <span></span>`;
    me.children[0].textContent = STATE[myStatus.state];
    me.children[1].textContent = myStatus.state === 'IDLE' ? '할 일을 골라 시작해요' : fmt(since(myStatus.since));
  }
}

setInterval(renderGrid, 1000);
refresh().then(renderGrid);
</script>
</body>
</html>
