# 운영 서버용. docker compose -f compose.prod.yaml up -d --build
# 로컬 개발용 compose.yaml과 이름을 나눠, 같은 컴퓨터에서 띄워도 DB가 섞이지 않는다
name: moyeobom-prod

x-logging: &logging
  # 로그가 디스크를 채우지 않게 서비스마다 10MB × 3개까지만 둔다
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: moyeobom
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    # 포트를 밖에 열지 않는다. app만 도커 내부망으로 접속한다
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  app:
    build: .
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/moyeobom
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_ORIGIN: https://${DOMAIN}
      TZ: UTC
    depends_on:
      mysql:
        condition: service_healthy
    logging: *logging

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # 받은 인증서를 보관한다. 지우면 다시 받다가 발급 횟수 제한에 걸릴 수 있다
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    logging: *logging

volumes:
  mysql-data:
  caddy-data:
  caddy-config:
