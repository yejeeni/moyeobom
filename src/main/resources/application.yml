spring:
  application:
    name: moyeobom
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

moyeobom:
  cors:
    allowed-origins:
      - http://localhost:5173
  room:
    grace-period: 60s
  # 가상 메이트 행동 규칙. 코드 수정 없이 조정할 수 있도록 설정으로 뺀다.
  mate:
    focus-duration:
      min: 25m
      max: 90m
    break-duration:
      min: 5m
      max: 15m
    complete-probability: 0.4
    leave-probability: 0.2
    refill-delay:
      min: 30s
      max: 2m
    # 쉬면 집중 인원이 앉은 사람의 과반보다 적어질 때, 휴식 대신 집중을 늘리는 시간
    focus-extension:
      min: 5m
      max: 10m
    initial:
      # 나를 빼고 처음 앉아 있는 메이트 수. 나머지 자리는 arrival-delay 뒤에 하나씩 채워진다
      mate-count-min: 4
      mate-count-max: 8
      arrival-delay:
        min: 1m
        max: 15m
      focus-ratio: 0.8
      completed-count-max: 3
      remaining-count-min: 1
      remaining-count-max: 4
