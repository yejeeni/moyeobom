name: moyeobom

services:
  mysql:
    image: mysql:8.4
    container_name: moyeobom-mysql
    environment:
      MYSQL_DATABASE: moyeobom
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      # 이 컴퓨터에서만 접속할 수 있게 묶는다. 서버에서 띄워도 DB 포트가 인터넷에 열리지 않는다
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
