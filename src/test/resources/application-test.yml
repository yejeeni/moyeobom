# DB 접속 정보는 Testcontainers(@ServiceConnection)가 주입한다.
logging:
  level:
    org.hibernate.SQL: debug

# 테스트는 시계를 직접 돌리므로 주기 작업이 끼어들지 않게 한다
moyeobom:
  focus:
    stale-check-interval: PT24H
    heartbeat-interval: PT24H
  # 테스트 클래스들이 같은 곳(127.0.0.1)에서 없는 코드를 넣으므로 서로 막히지 않게 넉넉히 둔다
  room:
    code-attempts:
      max-failures: 1000
